{{ define "main" }}
<section class="hero">
  <h1>NWSL Recaps</h1>
  <p>{{ .Site.Params.description }}</p>
</section>

<h2>Latest Recaps</h2>
<ul class="recap-list">
  {{ $recaps := where .Site.RegularPages "Section" "recaps" }}
  {{ range ($recaps.ByDate.Reverse | first 10) }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    <span class="recap-date">{{ .Date.Format "Jan 2, 2006" }}</span>
  </li>
  {{ end }}
</ul>
{{ end }}
