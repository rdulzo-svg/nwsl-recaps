{{ define "main" }}
<article class="recap">
  <h1>{{ .Title }}</h1>
  <p class="recap-meta">{{ .Date.Format "January 2, 2006" }}</p>

  <div class="recap-body">
    {{ .Content }}
  </div>

  {{ partial "rankings-table.html" . }}

  <p class="methodology-note">
    Rankings are generated from an analytical model built on match results and team performance,
    checked against real outcomes before publishing.
  </p>
</article>
{{ end }}
