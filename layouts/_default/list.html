{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ with .Content }}<div class="section-intro">{{ . }}</div>{{ end }}

<ul class="recap-list">
  {{ range .Pages.ByDate.Reverse }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    <span class="recap-date">{{ .Date.Format "Jan 2, 2006" }}</span>
  </li>
  {{ end }}
</ul>
{{ end }}
